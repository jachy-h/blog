baseURL = 'https://jinyu.cool/'
title = "Jachy · 开发实践与个人工具"
theme = 'PaperMod'
author = "Jachy"
enableEmoji = true
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true

# Obsidian 模板文件含 `{{date:...}}` 占位符，Hugo 0.158+ 会因 front matter 日期无法解析而报错
ignoreFiles = ["content/tempates/"]

[pagination]
pagerSize = 5

[minify]
disableXML = true
minifyOutput = true

# PaperMod 搜索页依赖 /index.json（fastsearch.js 请求 ../index.json）
[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
env = "production"
title = "Jachy's Blog"
description = "理解真实的问题，创造有意义的改变。Jachy 的观察、判断与实践：关注技术如何回应商业与生活中的真实需求。"
projectsTitle = "把想法做成工具"
mainSections = ["posts"]
keywords = ["Jachy", "AI 辅助开发", "开发工作流", "个人工具"]
author = "Jachy"
DateFormat = "2006-01-02"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

# [params.assets]
# favicon = "<link / abs url>"
# favicon16x16 = "<link / abs url>"
# favicon32x32 = "<link / abs url>"
# apple_touch_icon = "<link / abs url>"
# safari_pinned_tab = "<link / abs url>"

[params.label]
text = "Jachy / 开发与实践"
icon = "/apple-touch-icon.png"
iconHeight = 35

[params.profileMode]
enabled = true
title = "Jachy"
subtitle = "理解真实的问题，创造有意义的改变。"
imageUrl = "https://avatars.githubusercontent.com/u/25866839?s=400&u=aec3e16d03bcd68e7f9c558b9c65c065aed95494&v=4"
imageWidth = 120
imageHeight = 120
imageTitle = "Jachy"

[[params.profileMode.buttons]]
name = "Posts"
url = "posts"

[[params.profileMode.buttons]]
name = "About"
url = "about"

[params.homeInfoParams]
Title = "Hi there 👋"
Content = "Welcome to my blog"

# [[params.socialIcons]]
# name = "x"
# url = "https://x.com/"

[[params.socialIcons]]
name = "telegram"
url = "https://t.me/hoi12138"

[[params.socialIcons]]
name = "github"
url = "https://github.com/Mammoth777"

[params.analytics.google]
SiteVerificationTag = ""

[params.analytics.bing]
SiteVerificationTag = ""

[params.analytics.yandex]
SiteVerificationTag = ""

[params.cover]
hidden = true
hiddenInList = true
hiddenInSingle = true

[params.editPost]
URL = "https://github.com/Mammoth777/blog/tree/main/content"
Text = "source"
appendFilePath = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
includeMatches = true
location = 0
distance = 1_000
threshold = 0.3
minMatchCharLength = 1
limit = 30
ignoreLocation = true
keys = [
  { name = "title", weight = 0.6 },
  { name = "summary", weight = 0.25 },
  { name = "content", weight = 0.15 },
]

[[menu.main]]
name = "文章"
url = "/posts/"
weight = 10

[[menu.main]]
name = "项目"
url = "/projects/"
weight = 20

[[menu.main]]
name = "主题"
url = "/categories/"
weight = 30

[[menu.main]]
name = "关于"
url = "/about/"
weight = 40

[[menu.main]]
name = "搜索"
url = "/search/"
weight = 50

[markup.highlight]
noClasses = false
