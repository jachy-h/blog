baseURL = 'https://jinyu.cool/'
title = "Hoi !"
theme = 'PaperMod'
author = "Jachy"
enableEmoji = true
locale = "en-US"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true

# Obsidian 模板文件含 `{{date:...}}` 占位符，Hugo 0.158+ 会因 front matter 日期无法解析而报错
ignoreFiles = ["content/tempates/"]

[pagination]
pagerSize = 5

[minify]
disableXML = true
minifyOutput = true

# PaperMod 搜索页依赖 /index.json（fastsearch.js 请求 ../index.json）
[outputs]
home = ["HTML", "RSS", "JSON"]

[params]
env = "production"
title = "Jachy's Blog"
description = "人类必须相爱，否则就会灭亡"
projectsTitle = "Projects"
mainSections = ["posts"]
keywords = ["Blog", "Portfolio", "PaperMod"]
author = "Jachy"
images = ["<link or path of image for opengraph, twitter-cards>"]
DateFormat = "January 2, 2006"
defaultTheme = "auto"
disableThemeToggle = false
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
comments = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

# [params.assets]
# favicon = "<link / abs url>"
# favicon16x16 = "<link / abs url>"
# favicon32x32 = "<link / abs url>"
# apple_touch_icon = "<link / abs url>"
# safari_pinned_tab = "<link / abs url>"

[params.label]
text = "Jachy's Blog"
icon = "/apple-touch-icon.png"
iconHeight = 35

[params.profileMode]
enabled = true
title = "Hoi !"
subtitle = "人类必须相爱，否则就会灭亡"
imageUrl = "https://avatars.githubusercontent.com/u/25866839?s=400&u=aec3e16d03bcd68e7f9c558b9c65c065aed95494&v=4"
imageWidth = 120
imageHeight = 120
imageTitle = "my image"

[[params.profileMode.buttons]]
name = "Posts"
url = "posts"

[[params.profileMode.buttons]]
name = "About"
url = "about"

[params.homeInfoParams]
Title = "Hi there 👋"
Content = "Welcome to my blog"

# [[params.socialIcons]]
# name = "x"
# url = "https://x.com/"

[[params.socialIcons]]
name = "telegram"
url = "https://t.me/hoi12138"

[[params.socialIcons]]
name = "github"
url = "https://github.com/Mammoth777"

[params.analytics.google]
SiteVerificationTag = "XYZabc"

[params.analytics.bing]
SiteVerificationTag = "XYZabc"

[params.analytics.yandex]
SiteVerificationTag = "XYZabc"

[params.cover]
hidden = true
hiddenInList = true
hiddenInSingle = true

[params.editPost]
URL = "https://github.com/Mammoth777/blog/tree/main/content"
Text = "source"
appendFilePath = true

[params.fuseOpts]
isCaseSensitive = false
shouldSort = true
location = 0
distance = 1_000
threshold = 0.4
minMatchCharLength = 0
limit = 10
keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
identifier = "categories"
name = "Categories"
url = "/categories/"
weight = 10

[[menu.main]]
name = "Archives"
url = "/archives"
weight = 20

[[menu.main]]
name = "Search"
url = "/search"
weight = 30

