{{- $projects := hugo.Data.projects -}}
{{- if $projects }}
<section class="section projects-section" aria-labelledby="projects-heading">
    <div class="shell">
        <div class="section-head">
            <div>
                <p class="kicker">01 / SELECTED PROJECTS</p>
                <h2 id="projects-heading">{{ site.Params.projectsTitle | default "把想法做成工具" }}</h2>
            </div>
            <a class="section-link" href="{{ "projects/" | relLangURL }}">项目介绍 →</a>
        </div>
        <div class="project-list">
            {{- range $i, $project := $projects }}
            {{- partial "project_row.html" (dict "project" $project "index" $i) }}
            {{- end }}
        </div>
    </div>
</section>
{{- end }}
