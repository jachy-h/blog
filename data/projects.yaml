# 首页项目卡片数据（layouts/_partials/home_projects.html 读取）
#
# 字段说明：
#   name        项目名（必填）
#   description 一句话说明，纯文本
#   url         链接，可填站内路径（如 /posts/xxx/）或外部地址（自动新窗口打开）
#   icon        emoji，或 / 开头的图片路径（static 目录下）
#   tags        标签数组，可省略
#
# 标题可在 config.toml 的 [params] 中通过 projectsTitle 修改；
# 删除本文件或清空列表，首页就不会渲染项目区块。

