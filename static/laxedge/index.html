<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f3f0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="万圣节特别法律援助处 · 万圣节限定虚构法庭，娱乐互动。作者：嘴reality5li" />
  <meta property="og:title" content="万圣节特别法律援助处 · HALLOWEEN LEGAL AID" />
  <meta property="og:description" content="你有权保持沉默，但你说的每句话都会成为搭讪证据。" />
  <title>法律援助处测试版</title>
  <style>
/* 万圣节特别法律援助处 · 视觉样式（现代移动端 App 风格）—— 嘴reality5li
   浅色背景 + 深炭黑核心卡片 + 低饱和香槟金；酒红只用于有罪判决的局部强调。 */
:root {
  --bg: #f4f3f0;
  --surface: #ffffff;
  --surface-2: #efede8;
  --line: #e6e2da;
  --ink: #1c1b20;
  --ink-2: #6e6c72;
  --ink-3: #a9a6a0;
  --card: #1c1b20;
  --card-2: #2a2830;
  --card-btn: #36313b;
  --on-dark: #f6f4ef;
  --on-dark-2: #a6a2a9;
  --gold: #c8ad80;
  --gold-deep: #a88b5c;
  --gold-soft: #f3ece0;
  --wine: #9b2335;
  --wine-light: #e1677b;
  --r-lg: 24px;
  --r-md: 18px;
  --r-sm: 14px;
  --shadow: 0 1px 2px rgba(28, 27, 32, .04), 0 8px 24px -12px rgba(28, 27, 32, .12);
  --shadow-dark: 0 18px 40px -18px rgba(28, 27, 32, .55);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; min-height: 100%; background: var(--bg); }
body { color: var(--ink); font-family: var(--font); line-height: 1.55; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
button, a.btn { font: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 3px; }
h1:focus, h2:focus { outline: none; }
.ico { width: 20px; height: 20px; flex: none; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

.page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.wrap { width: 100%; max-width: 460px; margin: 0 auto; flex: 1; padding: 8px 18px 20px; display: flex; flex-direction: column; }

/* ---------- 动效：淡入上滑 ---------- */
.rise, .wrap > .h2, .case-card, .exhibit { animation: rise .45s var(--ease) both; }
.d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------- 顶栏 ---------- */
.appbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  max-width: 460px; width: 100%; margin: 0 auto; padding: calc(10px + var(--safe-t)) 18px 10px;
  background: rgba(244, 243, 240, .88); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
}
.brand { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.brand .ico { color: var(--gold-deep); width: 22px; height: 22px; }
.mute {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; padding: 0; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow);
}
.mute svg { width: 20px; height: 20px; }

/* ---------- 按钮 ---------- */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 12px 18px;
  border-radius: var(--r-md); border: 0; cursor: pointer; font-size: 16px; font-weight: 700; letter-spacing: .04em;
  text-decoration: none; text-align: center; user-select: none; -webkit-user-select: none;
  transition: transform .12s var(--ease), box-shadow .2s, background .2s, opacity .2s;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn .ico { width: 18px; height: 18px; }
.btn-dark { background: var(--card); color: var(--on-dark); box-shadow: var(--shadow-dark); }
.btn-light { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
.btn-guilty { background: var(--wine); color: #fff; box-shadow: 0 14px 28px -14px rgba(155, 35, 53, .7); }
.btn-hero { background: var(--card-btn); color: var(--gold); margin-top: 18px; }
.btn-hero .ico { transition: transform .2s var(--ease); }
.btn-hero:active .ico { transform: translateX(3px); }
.link-btn {
  display: inline-flex; align-items: center; gap: 6px; align-self: center; margin-top: 12px; padding: 10px 14px;
  background: none; border: 0; color: var(--ink-2); font-size: 14px; cursor: pointer;
}
.link-btn .ico { width: 16px; height: 16px; }
.actions { display: grid; gap: 10px; margin-top: 18px; }
.actions.two { grid-template-columns: 1fr 1fr; }
.actions.two .btn { font-size: 15px; letter-spacing: .01em; padding: 12px 8px; }

/* ---------- 页脚署名（一行淡色小字） ---------- */
.sig { text-align: center; padding: 14px 16px calc(18px + var(--safe-b)); font-size: 11.5px; color: var(--ink-3); letter-spacing: .04em; }

/* ---------- 通用标题 ---------- */
.h2 { font-size: clamp(22px, 6.2vw, 26px); font-weight: 800; letter-spacing: .01em; margin: 10px 0 4px; line-height: 1.3; }
.lead { margin: 0 0 16px; color: var(--ink-2); font-size: 15px; }
.sec-label { margin: 18px 0 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: .06em; }

/* ---------- PAGE 01 首页 ---------- */
.hero {
  margin-top: 6px; padding: 28px 22px 22px; border-radius: var(--r-lg); text-align: center;
  background: var(--card); color: var(--on-dark); box-shadow: var(--shadow-dark);
}
.hero-icon { color: var(--gold); }
.hero-icon .ico { width: 36px; height: 36px; }
.hero-title { margin: 10px 0 4px; font-size: clamp(22px, 6.9vw, 30px); font-weight: 800; letter-spacing: .02em; line-height: 1.25; }
.hero-sub { color: var(--gold); font-size: 13px; letter-spacing: .12em; }
.hero-quote { margin: 18px 0 0; font-size: 17px; line-height: 1.7; font-weight: 600; color: var(--on-dark); }
.hero-quote em { font-style: normal; color: var(--gold); white-space: nowrap; }
.row-card { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 14px 16px; background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--card); color: var(--gold); font-weight: 800; font-size: 17px; }
.row-body { display: flex; flex-direction: column; min-width: 0; }
.row-body b { font-size: 15px; }
.row-body small { font-size: 12px; color: var(--ink-2); }
.disclaimer { margin: 16px 6px 0; text-align: center; font-size: 11.5px; line-height: 1.7; color: var(--ink-3); }

/* ---------- PAGE 02 执业范围 ---------- */
.cards { display: grid; gap: 10px; }
.case-card {
  display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px 14px 16px 16px; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 0; border-radius: var(--r-md); box-shadow: var(--shadow);
  transition: transform .15s var(--ease), box-shadow .2s;
}
.case-card:active { transform: scale(.98); }
.case-card.opening { transform: scale(.97); box-shadow: 0 0 0 2px var(--gold) inset, var(--shadow); }
.cc-icon { width: 48px; height: 48px; border-radius: var(--r-sm); display: grid; place-items: center; flex: none; background: var(--card); color: var(--gold); }
.cc-icon .ico { width: 24px; height: 24px; }
.cc-body { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.cc-name { font-size: 17px; font-weight: 800; margin-left: -.45em; }
.cc-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.cc-arrow { color: var(--ink-3); }

/* ---------- PAGE 03 证据 ---------- */
.case-hero { margin-top: 10px; padding: 20px; border-radius: var(--r-lg); background: var(--card); color: var(--on-dark); box-shadow: var(--shadow-dark); }
.ch-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px 5px 9px; border-radius: 999px; background: var(--card-2); color: var(--gold); font-size: 12.5px; font-weight: 700; }
.chip .ico { width: 15px; height: 15px; }
.case-no { font-size: 12.5px; color: var(--on-dark-2); white-space: nowrap; }
.case-no b { color: var(--gold); font-size: 14px; }
.ch-title { margin: 14px 0 4px; font-size: 20px; font-weight: 800; }
.ch-desc { margin: 0; font-size: 15.5px; line-height: 1.7; color: #dcd8d2; overflow-wrap: anywhere; }
.exhibits { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.exhibit { display: flex; gap: 10px; align-items: flex-start; padding: 13px 14px; background: var(--surface); border-radius: var(--r-sm); box-shadow: var(--shadow); font-size: 14.5px; line-height: 1.6; overflow-wrap: anywhere; }
.ex-tag { flex: none; margin-top: 1px; padding: 1px 8px; border-radius: 999px; background: var(--gold-soft); color: var(--gold-deep); font-size: 12px; font-weight: 700; white-space: nowrap; }
.ask { margin-top: 6px; }
.court-q { margin: 0; padding: 14px 16px; border-radius: var(--r-sm); background: var(--gold-soft); color: var(--ink); font-size: 15.5px; font-weight: 700; line-height: 1.6; overflow-wrap: anywhere; }
.verdict-q { margin: 22px 0 0; text-align: center; font-size: 16px; font-weight: 700; }

/* ---------- PAGE 04 电子判决卡：有罪 / 无罪统一竖版 3:4 ---------- */
.verdict { padding-top: 4px; }
.page-kicker { margin: 6px 2px 10px; font-size: 12.5px; color: var(--ink-2); letter-spacing: .06em; }
.vcard {
  position: relative; display: flex; flex-direction: column; aspect-ratio: 3 / 4; padding: 22px 20px 16px;
  border-radius: var(--r-lg); overflow: visible; animation: cardIn .55s var(--ease) both; animation-delay: 1.15s;
}
@supports not (aspect-ratio: 3 / 4) { .vcard { min-height: calc((min(100vw, 460px) - 36px) * 4 / 3); } }
@keyframes cardIn { from { opacity: 0; transform: translateY(26px) scale(.98); } to { opacity: 1; transform: none; } }
.vc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px 6px 10px; border-radius: 999px; font-size: 13.5px; font-weight: 800; letter-spacing: .04em; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; animation-delay: 1.45s; }
.badge .ico { width: 16px; height: 16px; }
@keyframes pop { from { transform: scale(1.6); opacity: 0; } to { transform: none; opacity: 1; } }
.badge-wine { background: var(--wine); color: #fff; }
.badge-gold { background: var(--gold-soft); color: var(--gold-deep); }
.vc-no { font-size: 12.5px; white-space: nowrap; }
.vc-no b { font-size: 14px; }
.vc-case { margin: 14px 0 0; padding-bottom: 16px; font-size: 14.5px; line-height: 1.65; overflow-wrap: anywhere; }
.vc-case b { display: block; font-size: 16px; margin-bottom: 2px; }
.vc-label { margin-top: 14px; font-size: 12.5px; font-weight: 600; letter-spacing: .06em; }
.vc-charge { margin-top: 2px; font-size: clamp(25px, 7.4vw, 30px); font-weight: 900; line-height: 1.3; overflow-wrap: anywhere; }
.vc-truth { position: relative; margin-top: 16px; padding: 16px 16px 14px 18px; border-radius: var(--r-md); }
.vc-truth::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 3px; background: var(--gold); }
.vc-truth .vc-label { margin-top: 0; }
.truth { margin: 6px 0 0; font-size: 19px; font-weight: 800; line-height: 1.55; overflow-wrap: anywhere; }
.truth::before { content: "“"; } .truth::after { content: "”"; }
.vc-note { margin: 8px 0 0; font-size: 12.5px; }
.vc-reason { margin: 4px 0 0; font-size: 22px; font-weight: 800; line-height: 1.55; overflow-wrap: anywhere; }
.vc-foot { margin-top: auto; padding-top: 18px; text-align: center; font-size: 11px; letter-spacing: .04em; }
/* 主要内容在卡片剩余空间中居中，两种卡片视觉重心一致 */
.vcard-guilty .vc-case + .vc-label, .vcard-innocent .vc-case + .vc-label { margin-top: auto; }
.vcard .vc-truth, .vcard .vc-reason { margin-bottom: auto; }
.flash { animation: flash .4s var(--ease); }
@keyframes flash { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.hint { margin: 10px 4px 0; text-align: center; font-size: 12px; color: var(--ink-3); }

.vcard-guilty { background: var(--card); color: var(--on-dark); box-shadow: var(--shadow-dark); }
.vcard-guilty .vc-no { color: var(--on-dark-2); } .vcard-guilty .vc-no b { color: var(--gold); }
.vcard-guilty .vc-case { color: var(--on-dark-2); border-bottom: 1px solid rgba(255, 255, 255, .1); }
.vcard-guilty .vc-case b { color: var(--on-dark); }
.vcard-guilty .vc-label { color: var(--on-dark-2); }
.vcard-guilty .vc-label.gold { color: var(--gold); }
.vcard-guilty .vc-charge { color: var(--wine-light); }
.vcard-guilty .vc-truth { background: var(--card-2); }
.vcard-guilty .vc-note, .vcard-guilty .vc-foot { color: #77737b; }

.vcard-innocent { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); border: 1px solid var(--line); }
.vcard-innocent .vc-no { color: var(--ink-2); } .vcard-innocent .vc-no b { color: var(--gold-deep); }
.vcard-innocent .vc-case { color: var(--ink-2); border-bottom: 1px solid var(--line); }
.vcard-innocent .vc-case b { color: var(--ink); }
.vcard-innocent .vc-label.gold { color: var(--gold-deep); }
.vcard-innocent .vc-foot { color: var(--ink-3); }


/* 当事人标识与三选一辩护 */
.case-role { display: inline-block; margin-top: 12px; padding: 3px 10px; border-radius: 999px; background: var(--card-2); color: var(--on-dark-2); font-size: 12px; font-weight: 600; }
.defenses { display: grid; gap: 10px; margin-top: 12px; }
.defense-opt {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 15px 16px; text-align: left; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow);
  font-size: 15.5px; line-height: 1.55; font-weight: 600; transition: transform .12s var(--ease), border-color .2s;
}
.defense-opt:active { transform: scale(.98); border-color: var(--gold); }
.def-no { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; background: var(--card); color: var(--gold); font-size: 12.5px; font-weight: 800; }
.def-text { min-width: 0; overflow-wrap: anywhere; }
.vc-explain { margin: 6px 0 0; font-size: 13.5px; line-height: 1.6; color: var(--on-dark-2); overflow-wrap: anywhere; }

/* 窄屏手机：收紧判决卡字号与间距，让有罪 / 无罪卡尽量都保持同样的 3:4 尺寸（内容仍放不下时卡片向下增高，不会裁切） */
@media (max-width: 420px) {
  .vcard { padding: 18px 16px 12px; }
  .vc-case { margin-top: 10px; padding-bottom: 10px; font-size: 13px; line-height: 1.55; }
  .vc-case b { font-size: 15px; }
  .vc-label { margin-top: 10px; font-size: 12px; }
  .vc-charge { font-size: clamp(20px, 6.2vw, 26px); }
  .vc-explain { margin-top: 3px; font-size: 12.5px; line-height: 1.5; }
  .vc-truth { margin-top: 10px; padding: 11px 13px 9px 15px; }
  .vc-truth::before { top: 12px; bottom: 12px; }
  .truth { margin-top: 4px; font-size: clamp(14.5px, 4.4vw, 17px); line-height: 1.45; }
  .vc-note { margin-top: 4px; font-size: 11.5px; }
  .vc-reason { font-size: clamp(17px, 5.2vw, 20px); }
  .vc-foot { padding-top: 10px; font-size: 10.5px; }
  .badge { padding: 5px 11px 5px 9px; font-size: 12.5px; }
}

/* 简洁裁决动效：图标落槌 + 两行字淡入，约 1.2 秒 */
.intro {
  position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: var(--bg); animation: introOut .3s ease 1s forwards; pointer-events: auto; /* 宣判动画期间拦截点击，避免误触下面尚未显示的按钮 */
}
.intro.done { display: none; }
@keyframes introOut { to { opacity: 0; visibility: hidden; } }
.intro-icon { width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; margin-bottom: 10px; background: var(--card); color: var(--gold); box-shadow: var(--shadow-dark); animation: tap .5s cubic-bezier(.3, 1.6, .5, 1) .1s both; }
.intro-icon.guilty { color: #fff; background: var(--wine); }
.intro-icon .ico { width: 36px; height: 36px; }
@keyframes tap { 0% { transform: scale(.6) rotate(-18deg); opacity: 0; } 60% { transform: scale(1.08) rotate(6deg); opacity: 1; } 100% { transform: none; } }
.intro-l1 { margin: 0; font-size: 22px; font-weight: 800; animation: rise .35s var(--ease) .25s both; }
.intro-l2 { margin: 0; font-size: 15px; color: var(--ink-2); animation: rise .35s var(--ease) .45s both; }

/* ---------- PAGE 05 导出 / 保存到相册 ---------- */
.export { position: fixed; inset: 0; z-index: 50; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg); animation: sheetIn .32s var(--ease) both; }
@keyframes sheetIn { from { transform: translateY(40px); } to { transform: none; } }
.export-inner { max-width: 460px; margin: 0 auto; padding: calc(18px + var(--safe-t)) 18px 0; text-align: center; }
.export-title { margin: 4px 0 4px; font-size: 21px; font-weight: 800; outline: none; }
.export-hint { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
.export-hint b { color: var(--ink); }
.export-tip { margin: 12px 0 0; text-align: center; font-size: 12px; color: var(--ink-3); }
.export-img { display: block; width: 100%; max-width: 340px; aspect-ratio: 3 / 4; margin: 0 auto; border-radius: 18px; box-shadow: 0 20px 40px -20px rgba(28, 27, 32, .4); -webkit-touch-callout: default; user-select: auto; }

/* ---------- 今日援助已完成 ---------- */
.full { justify-content: center; }
.notice { padding: 30px 22px 18px; border-radius: var(--r-lg); background: var(--card); color: var(--on-dark-2); text-align: center; box-shadow: var(--shadow-dark); animation: rise .8s var(--ease) both; }
.notice p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.75; }
.notice-icon { display: inline-grid; place-items: center; color: var(--gold); }
.notice-icon .ico { width: 44px; height: 44px; }
.notice-title { margin: 8px 0 14px; font-size: clamp(22px, 6.4vw, 26px); font-weight: 800; color: var(--on-dark); line-height: 1.3; }
.closing { margin: 14px 0 0 !important; font-size: 19px !important; font-weight: 800; color: var(--gold); letter-spacing: .04em; }
.notice .btn-hero { margin-top: 22px; }

/* ---------- 提示 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(22px + var(--safe-b)); z-index: 60; transform: translate(-50%, 16px);
  width: min(92vw, 420px); padding: 12px 16px; border-radius: var(--r-sm); font-size: 14px; line-height: 1.55; text-align: center;
  background: var(--card); color: var(--on-dark); opacity: 0; pointer-events: none; transition: opacity .2s, transform .25s var(--ease);
  box-shadow: var(--shadow-dark);
}
.toast.error { box-shadow: 0 0 0 1px rgba(225, 103, 123, .6) inset, var(--shadow-dark); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 管理台复用 */
.panel { border-radius: 18px; padding: 16px; background: var(--surface); box-shadow: var(--shadow); margin-bottom: 12px; }

@media (max-width: 360px) {
  .wrap, .appbar { padding-left: 14px; padding-right: 14px; }
  .actions.two { grid-template-columns: 1fr; }

  <script>
"use strict";(()=>{var ue=[{key:"A",name:"青春损失追偿",desc:"帮朋友向前任追讨青春损失费",code:"YOUTH RECOVERY"},{key:"B",name:"暧昧纠纷代理",desc:"代理暧昧纠纷、已读不回案件",code:"AMBIGUITY DISPUTES"},{key:"C",name:"非法心动案件",desc:"处理万圣节非法心动事件",code:"ILLEGAL HEARTBEAT"},{key:"D",name:"酒后紧急辩护",desc:"为喝醉后胡言乱语的嫌疑人提供辩护",code:"AFTER-PARTY DEFENSE"}];var G={A:["分手后，你找过最蹩脚的联系借口是什么？","和前任一起追过的剧里，哪一部你现在还不敢点开？","有没有哪首歌，到现在你都不敢随便点开？","你最舍不得的，是那个人，还是那时候的自己？","如果前任今晚给你发消息，你会秒回、晚点回，还是不回？","有没有一句话，你一直想对前任说，却最后没有说出口？","回头看，那段感情教会你最重要的一件事是什么？","有没有一个地方，因为那个人，你很久都没有再去过？"],B:["你有没有明明很在意一个人，却故意装作无所谓？","你收到过最让你心动的一条消息是什么？","暧昧的时候，你通常是先试探的人，还是等对方开口的人？","为了回一条消息打了又删，你最多删过几遍？","被已读不回的时候，你心里最常上演的剧本是什么？","什么样的瞬间，会让你从“有点好感”变成“完了，我陷进去了”？","如果暧昧对象今晚问你“我们算什么”，你会怎么回答？","你点开次数最多的一个主页，是谁的？（可以只说关系）"],C:["今晚第一个让你多看两眼的人，穿的是什么装扮？","请如实陈述：你对本律师的第一印象是什么？","你更容易被一个人的长相吸引，还是被说话的方式吸引？","声音、手、笑容、香味，哪一个最容易让你心动？","你今晚的装扮，有没有一点点是想让某个人看到？","你相信一见钟情吗？你自己经历过吗？","你觉得自己身上最犯规的地方是什么？","如果今晚有人向你要糖，你最希望是谁？（可以只描述装扮）"],D:["有没有一句话，你只敢在放松的时候才说出口？","你经历过最尴尬的一次聚会，是什么场面？","你最想撤回的一条消息，是发给谁的？（可以只说关系）","你状态最放松的时候，最想给谁打一个电话？","你说过的豪言壮语里，哪一句最让你后悔？","深夜写好却没发出去的消息，你写给了谁？（可以只说关系）","如果明天醒来会忘记今晚，你现在最想做的一件事是什么？","你最想对今晚在场的某个人说什么？（不必说出是谁）"]};var f=(e,t)=>t.map(n=>G[e][n]),i=(e,t,n)=>({text:e,verdict:"guilty",charge:t,reason:n}),c=(e,t)=>({text:e,verdict:"innocent",reason:t}),ae=[{id:"A001",category:"A",title:"视频会员借用案",desc:"分手三个月后，你突然联系前任，声称只是想借用一下对方的视频会员。",evidence:["聊天记录显示，你的开场白是“在吗”，四分钟后才补了一句“你那个会员还能用吗”。","同一时段，该平台某热播剧恰好更新大结局。"],defenses:[i("我真的只是想看大结局，跟前任没有任何关系。","旧情非法续费罪","只为追剧的话，开一个月会员就够了。先发“在吗”再提会员，本庭认定你另有所图。"),c("会员是我们一起开的，我是在提醒对方及时取消自动续费。","本庭认定你出于对共同财产的责任心，虽然多此一举，但动机善良，准予释放。"),c("我承认，我只是想找个理由，和对方说一句话。","鉴于你当庭坦白、态度诚恳，本庭认定想念不构成犯罪。下次可以直接说“好久不见”。")],truths:f("A",[0,1,4])},{id:"A002",category:"A",title:"二手平台转卖案",desc:"你把前任送的礼物挂上了二手平台，商品描述写着“全新未使用，送人没送出去”。前任刷到后，控告你侮辱共同回忆。",evidence:["标价为原价三折，并注明“支持小刀”。","商品详情图的背景里，还能看到你们一起买的那盏台灯。"],defenses:[c("东西放着也是放着，物尽其用是一种美德。","本庭认定，让旧物找到新主人属于环保行为，回忆不会因为转卖而贬值，准予释放。"),i("我写“没送出去”，是因为那段感情本来就没送到对的人手里。","回忆擅自转让罪","你在商品描述里夹带个人情绪，本庭认定构成对共同回忆的公开转让。"),i("我故意挂出来，就是想让对方刷到。","情侣物品违规处置罪","你当庭承认把二手平台当作情绪广播站，蓄意明显，罪名成立。")],truths:f("A",[3,6,7])},{id:"A003",category:"A",title:"共享歌单续更案",desc:"分手半年，你仍在往两人共建的歌单“我们的周末”里加歌，最近新增的 12 首全是苦情歌。前任每次打开音乐软件都会收到更新提醒。",evidence:["歌单最新一首歌添加于凌晨 1:14。","歌单名称至今未改，仍然叫“我们的周末”。"],defenses:[c("歌单是我建的，我在自己的地盘听歌，合理合法。","本庭认定，在自己参与创建的歌单里听歌属于个人自由，不构成骚扰，准予释放。"),i("我只是懒得新建一个歌单。","前任余温残留罪","懒得改名可以理解，懒得停止添加苦情歌则不能。本庭认定你仍在借歌传情。"),c("我以为歌单早就设为私密了，忘了对方还是协作者。","本庭认定疏忽不构成故意。请于今晚移除协作者，当庭释放。")],truths:f("A",[2,5,3])},{id:"A004",category:"A",title:"生日提醒滞留案",desc:"分手一年，前任的生日提醒仍在你的手机日历里准时响起。今年提醒响起时，你下意识打开了蛋糕店页面。",evidence:["提醒备注写着“提前一周订蛋糕”。","你在蛋糕店页面停留了 40 秒，并把一款蛋糕加入了购物车。"],defenses:[i("我只是自己想吃蛋糕，刚好被提醒了。","纪念日违规保留罪","想吃蛋糕不需要提前一周提醒。本庭认定这条提醒仍在为旧人服务。"),c("我当场删掉了提醒，购物车也清空了。","鉴于你在 40 秒内完成了心动、犹豫、删除的全过程，本庭认定你已具备放下的能力，准予释放。"),i("我想给对方寄一块，就当是最后的礼物。","情感债务拖欠罪","分手一年仍在履行生日义务，本庭认定这笔情感账尚未结清。")],truths:f("A",[4,5,3])},{id:"A005",category:"A",title:"红烧肉秘方案",desc:"你曾为前任学会做红烧肉。分手后，前任的新恋人在朋友圈晒出同款，配文“家传秘方”。你在评论区留言“这个秘方我很熟”，随即被前任起诉。",evidence:["评论发布于晚上 11:47，三分钟内获得 6 个赞。","经查，该“秘方”是你在视频网站学的第三个版本。"],defenses:[c("我只是陈述事实，这道菜确实是我教的。","本庭认定你对这道菜享有合理的署名权，陈述事实不构成挑衅，准予释放。"),i("我是好心提醒，冰糖要少放一点，不然会腻。","厨艺余情未了罪","深夜给前任的新恋人提供烹饪指导，本庭认定你仍在关心这锅肉旁边的人。"),i("评论发完我就删了，只存在了三分钟。","回忆公开展示罪","三分钟就收获 6 个赞，说明你挑了最热闹的时间发布。删除不影响定罪。")],truths:f("A",[6,7,0])},{id:"B001",category:"B",title:"凌晨点赞案",desc:"你凌晨两点给前任点了一个赞，事后坚称只是手滑。",evidence:["点赞时间为 02:13，被点赞的是对方三年前的一张旧照。","经测量，找到这张照片需要向下滑动约 40 屏。"],defenses:[i("真的是手滑，我的手机屏幕太灵敏了。","手滑伪证罪","屏幕再灵敏，也滑不出连续 40 屏的精准定位。本庭不采信“手滑”说法。"),c("那天是对方生日，我在犹豫要不要发一句生日快乐。","本庭认定，出于礼貌的犹豫不构成暧昧。你只是太会替别人着想，准予释放。"),i("我承认是故意的，我想让对方知道我还在。","恶意制造暧昧罪","你当庭承认蓄意留下痕迹。本庭欣赏你的诚实，但这正是暧昧的构成要件。")],truths:f("B",[7,0,2])},{id:"B002",category:"B",title:"一碗面已读案",desc:"你已读了对方发来的一段长消息，一分钟后却发了一条朋友圈。对方认为你在冷处理，向本庭提起诉讼。",evidence:["消息显示已读时间为 21:02。","你的朋友圈发布于 21:03，内容是一碗面。"],defenses:[i("面坨了就不好吃了，我得先拍照。","已读不回罪","本庭认定，一碗面的保质期不应该高于一段关系。"),c("那条消息太重要了，我想认真组织好语言再回。","本庭认定慎重回复属于对感情的尊重，准予释放，但限你今晚 12 点前提交回复。"),c("那碗面就是我的回复，我们约好了下次一起去吃这家。","本庭查明这是一条加密回复，构成浪漫，不构成冷落，当庭释放。")],truths:f("B",[4,3,1])},{id:"B003",category:"B",title:"“改天”无期案",desc:"你连续三个月对一个人说“改天请你吃饭”，改天始终没有到来。万圣节当晚，对方决定当面起诉你。",evidence:["聊天记录中，“改天”一共出现了 11 次。","经日历鉴定，“改天”这一天并不存在。"],defenses:[c("我一直在等一个特别的日子，比如今天。","本庭认定万圣节符合“特别的日子”，判令你今晚兑现承诺，当庭释放。"),i("最近真的太忙了。","“改天”无限期拖延罪","你说了 11 次“改天”，花掉的时间足够吃 11 顿饭。忙碌理由不成立。"),i("我怕吃完这顿饭，就找不到下一次见面的理由了。","心意隐瞒不报罪","你把喜欢藏在“改天”里，本庭认定属于故意拖延告白。")],truths:f("B",[6,2,5])},{id:"B004",category:"B",title:"备注降级案",desc:"你发现自己在对方手机里的备注是“饭搭子3号”，于是把对方的备注改成了“饭搭子1号（候补）”。对方认为你在蓄意报复。",evidence:["你改备注的时间，是看到对方手机后的第 5 分钟。","对方通讯录里共有 3 个饭搭子，只有你的备注后面带了一个小太阳。"],defenses:[i("我只是礼尚往来，按规矩排了个号。","情感排位报复罪","礼尚往来应当对等，你却把对方降成了候补，本庭认定报复意图明显。"),c("我没注意到那个小太阳，早知道我会改成“唯一的饭搭子”。","本庭认定你的过激反应源于信息不对称。误会已经解除，准予释放。"),i("我就是想看看，对方发现后会不会着急。","试探性心动罪","你当庭承认用备注测试对方的反应，属于典型的暧昧行为，罪名成立。")],truths:f("B",[0,7,6])},{id:"B005",category:"B",title:"顺路送伞案",desc:"下雨天，你特意给对方送了一把伞，第二天却说“只是顺路”。对方查了地图之后，把你告上法庭。",evidence:["你们的住址相距 11 公里，方向相反。","导航记录显示，所谓的“顺路”需要掉头两次。"],defenses:[i("我那天真的要去那边办事，伞是顺手送的。","虚构顺路罪","真要去那边办事，不需要掉头两次才“顺路”。本庭不采信。"),c("我那段时间在练车，掉头是练习科目。","本庭认定掉头两次符合练车标准，送伞属于附带的好人好事，准予释放。"),c("我承认不顺路，我只是不想让对方淋雨。","本庭认定坦白的心意不构成欺诈。顺路是假的，关心是真的，当庭释放。")],truths:f("B",[5,1,2])},{id:"C001",category:"C",title:"一夜三心案",desc:"万圣节当晚，你涉嫌同时偷走了三个人的心。",evidence:["现场目击者三名，均表示“心跳不受控制”。","经勘查，作案工具疑似为你的一个微笑。"],defenses:[c("我只是正常微笑，是他们太容易心动了。","本庭认定，微笑属于合法持有物品，心动属于受害人的自愿行为，准予释放。"),i("我是故意的，今晚本来就是我的主场。","非法偷心罪","你当庭承认蓄意作案，且毫无悔意。本庭依法从重判决。"),i("我今晚戴着面具，他们心动的不是真正的我。","持微笑作案罪","本庭查明，面具挡住了你的脸，却没有挡住你的笑容。辩护理由不成立。")],truths:f("C",[6,0,1])},{id:"C002",category:"C",title:"面具之声案",desc:"你全程戴着面具，只对身边的人说了一句“借过”。对方当场决定，今晚一定要知道面具下是谁，并以“声音过于犯规”起诉你。",evidence:["你一共说了两个字，用时不到一秒。","对方在原地愣了七秒，错过了下一首歌的开头。"],defenses:[c("我只是正常说话，声音是爸妈给的。","本庭认定先天音色不属于作案工具，准予释放。"),i("那句“借过”，我是故意压低了声音说的。","声音蓄意吸引罪","你当庭承认刻意调整声线，本庭认定构成故意。"),c("我愿意当场摘下面具，配合调查。","摘下面具后，原告表示调查结果令人满意，当庭撤诉。")],truths:f("C",[3,2,5])},{id:"C003",category:"C",title:"糖果加倍案",desc:"有人以“不给糖就捣蛋”为由向你要糖，你回赠了一颗更大的。对方表示糖还没吃，心已经乱了。",evidence:["本次糖果交换比例为 1 : 3。","对方至今把那颗糖放在口袋最里层，舍不得吃。"],defenses:[i("我手上只剩大颗的了。","糖果诱导心动罪","糖可以只剩大颗，但对方至今舍不得吃，说明这颗糖已经起了作用。本庭认定你需对后果负责。"),c("万圣节的规矩就是这样，给糖要大方。","本庭认定节日慷慨属于民俗传统，不构成蓄意心动，准予释放。"),i("我想看看对方会不会回来，再要第二颗。","非法占用他人注意力罪","你用一颗糖为下一次见面埋下伏笔，本庭认定预谋成立。")],truths:f("C",[7,4,1])},{id:"C004",category:"C",title:"鬼屋保护案",desc:"在鬼屋里，你一路抓着对方的袖子，出来后却说“我是在保护你”。对方认为你另有所图。",evidence:["工作人员证明，你在最不吓人的那一段也没有松手。","出口的抓拍照片里，你在笑。"],defenses:[c("我是真的害怕，笑是吓完之后的应激反应。","本庭认定恐惧和笑容可以同时存在，准予释放。"),c("我确实在保护对方，您看，对方全程都没尖叫。","本庭认定保护效果显著，且原告无法反驳，当庭释放。"),i("我承认，我早就想找个理由离对方近一点。","鬼屋借势心动罪","你把鬼屋当成了拉近距离的合法场所，动机明确，罪名成立。")],truths:f("C",[5,0,6])},{id:"C005",category:"C",title:"月色真好案",desc:"你和对方站在窗边，你突然说了一句“今晚月色真好”。对方回家查了天气，认为你说的根本不是月亮。",evidence:["经气象核实，当晚月亮被云挡住了大半。","你说这句话时，眼睛并没有看月亮。"],defenses:[i("我近视，没看清那片云。","借景抒情罪","近视可以看不清云，却看得清自己在看谁。本庭不采信。"),c("那是我最近在读的一本小说里的句子，我在背书。","本庭认定引用名句属于文学素养，不构成告白，准予释放。"),i("我说的就是别的事，对方听懂了就好。","公然暗号告白罪","你当庭确认这是一句暗号，本庭认定构成蓄意心动。")],truths:f("C",[5,3,4])},{id:"D001",category:"D",title:"十七条语音案",desc:"聚会结束后，你给前任发了 17 条语音，第二天声称自己完全失忆。",evidence:["语音总时长约 11 分钟，其中 3 分钟为清唱。","你第二天发了一条朋友圈：“昨晚睡得很早。”"],defenses:[i("我真的什么都不记得了，那不是清醒的我。","选择性失忆罪","你不记得发了什么，却记得第二天发朋友圈说自己睡得早。本庭不采信失忆说法。"),c("我是在练歌，只是不小心发错了对象。","本庭查明，清唱部分确实长达 3 分钟，认定你在认真练歌，其余部分按排练花絮处理，准予释放。"),c("第二天我已经主动道歉，并且撤回了能撤回的部分。","鉴于你事后主动道歉、积极补救，本庭认定态度良好，当庭释放。")],truths:f("D",[2,5,3])},{id:"D002",category:"D",title:"公司大群告白案",desc:"聚会散场后，你在公司大群里发了一句“我爱你们每一个人”。老板先回了一个“？”，又补了一句“早点休息”。",evidence:["消息发送时间为凌晨 00:47。","群成员共 86 人，已读 79 人。"],defenses:[c("我说的是真心话，团队就是我的家。","本庭认定深夜的集体之爱属于企业文化建设，准予释放。"),i("是我家猫踩到了手机。","嫁祸于猫罪","本庭查明，猫不会使用“每一个”这样的量词。"),c("第二天撤回不了，我就在群里发了个大红包。","本庭认定红包具有强大的舆论修复功能，当庭释放。")],truths:f("D",[1,2,0])},{id:"D003",category:"D",title:"十分钟结拜案",desc:"你和一个刚认识十分钟的人当场结拜，承诺“你结婚我一定来致辞”。对方说自己已婚，你立刻改口：“那我当你孩子的干爸干妈。”",evidence:["结拜仪式持续约 40 秒。","“干爸干妈”的承诺被三名证人录了下来。"],defenses:[i("我只是被气氛感染，说的都是客套话。","草率结拜罪","客套话不需要三名证人见证。本庭认定这份承诺具有约束力。"),c("我是认真的，今天已经开始攒满月礼的钱了。","本庭认定你兑现承诺的速度令人感动，准予释放。"),i("我以为对方是我失散多年的老同学。","盲目认亲罪","认识十分钟就结拜，事后才想起是“老同学”。本庭认定你结拜前并未核实身份。")],truths:f("D",[4,1,7])},{id:"D004",category:"D",title:"“我请客”未遂案",desc:"你豪迈地宣布“今天我请客”，结账时却发现手机没电了。最后由刚才提议 AA 的朋友代为付款。",evidence:["手机最后的电量截图显示为 1%。","你宣布请客时，屏幕上就已经亮起了低电量提醒。"],defenses:[i("我真的不知道手机快没电了。","豪言买单未遂罪","低电量提醒在你宣布请客时就已经亮起，本庭认定你应当知道。"),c("第二天我就把钱转了回去，还多转了一杯奶茶钱。","本庭认定你及时履约，并主动支付了利息，准予释放。"),i("我说的请客，是请大家吃桌上的瓜子。","请客虚假宣传罪","你当庭重新定义了“请客”，本庭不予采纳。")],truths:f("D",[4,1,6])},{id:"D005",category:"D",title:"民宿梦想案",desc:"聚会上，你宣布明天就辞职去开民宿，连名字都想好了，叫“随便住住”。第二天早上 8:59，你准时打卡上班。",evidence:["当晚你在餐巾纸上画了一张民宿平面图。","你还当场邀请了六位朋友成为“首批股东”。"],defenses:[i("我打卡是为了去办离职手续。","公开立 flag 罪","办离职不需要卡在 8:59 准时到岗。本庭不采信。"),c("梦想要先说出来，我只是在练习。","本庭认定说出梦想不构成违约，“随便住住”的名字予以保留，准予释放。"),c("那张餐巾纸我已经裱起来了，攒够钱就开。","本庭认定计划仍在推进中，不属于空头承诺，当庭释放，并预订开业第一晚。")],truths:f("D",[4,6,0])}],j={A:ae.filter(e=>e.category==="A"),B:ae.filter(e=>e.category==="B"),C:ae.filter(e=>e.category==="C"),D:ae.filter(e=>e.category==="D")};var se=new Map,w={get(e){try{let t=window.localStorage.getItem(e);if(t!==null)return t}catch(t){}return se.has(e)?se.get(e):null},set(e,t){try{window.localStorage.setItem(e,t),se.delete(e);return}catch(n){}se.set(e,t)}};function Te(e,t){let n=e.slice();for(let s=n.length-1;s>0;s--){let a=Math.floor(t()*(s+1));[n[s],n[a]]=[n[a],n[s]]}return n}function Se(e,t){try{let n=JSON.parse(e.get(t)||"[]");return Array.isArray(n)?n.filter(s=>typeof s=="string"):[]}catch(n){return[]}}function ke(e,t,n,s=Math.random){let a=new Set(e),r=Se(n,`${t}.bag`).filter(b=>a.has(b)),o=Se(n,`${t}.recent`).filter(b=>a.has(b));if(r.length===0){let b=new Set(o.slice(-Math.min(5,Math.floor(e.length/3)))),U=Te(e.filter(T=>!b.has(T)),s),V=Te(e.filter(T=>b.has(T)),s);r=U.concat(V)}let u=r.shift();return n.set(`${t}.bag`,JSON.stringify(r)),n.set(`${t}.recent`,JSON.stringify(o.concat(u).slice(-10))),u}function $e(e,t,n=Math.random){let s=j[e],a=ke(s.map(r=>r.id),`hla.case.${e}`,t,n);return s.find(r=>r.id===a)}function De(e,t,n,s){let a=ke(e.map((r,o)=>String(o)),t,n,s);return e[Number(a)]}function et(e,t,n=Math.random){return De(G[e],`hla.truth.${e}
